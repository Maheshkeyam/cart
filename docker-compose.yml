version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: bagisto_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # Ensure Nginx config exists
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
    container_name: bagisto_php_fpm
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      PHP_MEMORY_LIMIT: 512M
    depends_on:
      - mysql


  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "redhat"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    #   MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s
  adminer:
    image: adminer:latest # Using the official Adminer Docker image
    container_name: bagisto_adminer
    ports:
      - "8080:8080" # Access Adminer on port 8080 from your host
    depends_on:
      - mysql # Adminer needs MySQL to be running
