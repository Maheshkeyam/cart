services:
  nginx:
    image: nginx:latest
    container_name: bagisto_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/generate-ssl.sh:/generate-ssl.sh
    entrypoint: ["/generate-ssl.sh"]
    depends_on:
      - php-fpm


  php-fpm:
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
    container_name: bagisto_php_fpm
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      PHP_MEMORY_LIMIT: 512M
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "redhat"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

  adminer:
    image: adminer:latest
    container_name: bagisto_adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  certbot_init:
    image: certbot/certbot:latest
    container_name: certbot_init
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for nginx to be ready...' &&
        sleep 15 &&
        if [ ! -f /etc/letsencrypt/live/goldencart.biz/fullchain.pem ]; then
          echo 'Requesting initial certificate...' &&
          certbot certonly --webroot -w /var/www/certbot \
            -d goldencart.biz \
            --email your_email@example.com \
            --agree-tos \
            --no-eff-email \
            --noninteractive;
        else
          echo 'Certificate already exists, skipping.';
        fi
      "

  certbot:
    image: certbot/certbot:latest
    container_name: bagisto_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $!; done;'"
