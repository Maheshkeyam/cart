services:
  nginx:
    image: nginx:latest
    container_name: bagisto_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/generate-ssl.sh:/generate-ssl.sh
    entrypoint: ["/generate-ssl.sh"]
    depends_on:
      - php-fpm


  php-fpm:
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
    container_name: bagisto_php_fpm
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      PHP_MEMORY_LIMIT: 512M
    command: >
        sh -c "find /var/www/html \
        -path /var/www/html/.git -prune -o \
        -path /var/www/html/node_modules -prune -o \
        -path /var/www/html/mysql-data -prune -o \
        -exec chown www-data:www-data {} + && php-fpm"     
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "redhat"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

  adminer:
    image: adminer:latest
    container_name: bagisto_adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  certbot_init:
    image: certbot/certbot:latest
    container_name: certbot_init
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 'Waiting for nginx to be ready...'
        sleep 15

        echo 'Backing up existing certs...'
        mkdir -p /tmp/certbackup
        cp -r /etc/letsencrypt/* /tmp/certbackup/ || true

        echo 'Requesting initial certificate...'
        if certbot certonly --webroot -w /var/www/certbot \
          -d goldencart.biz \
          --email goldencartbiz@gmail.com \
          --agree-tos \
          --no-eff-email \
          --non-interactive; then
            echo 'Certificate successfully created.'
        else
            echo 'Certificate request failed. Restoring backup...'
            cp -r /tmp/certbackup/* /etc/letsencrypt/
        fi

